// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// OneDrive can briefly lock Gradle's incremental ZIP cache on Windows. The
// release script points this at a disposable local directory so packaging is
// isolated from sync/indexing processes while Android Studio keeps its normal
// build directory when this environment variable is absent.
def externalBuildRoot = System.getenv("PACKFORGE_GRADLE_BUILD_ROOT")
if (externalBuildRoot) {
    rootProject.buildDir = file("${externalBuildRoot}/root")
    subprojects {
        project.buildDir = file("${externalBuildRoot}/${project.name}")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
